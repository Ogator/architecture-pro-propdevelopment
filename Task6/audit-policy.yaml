# Политика аудита
# Отличие: в первое правило добавлена группа rbac.authorization.k8s.io. Roles и RoleBindings
# лежат в ней, а не в core-группе "", поэтому без неё создание RoleBinding попадало бы только
# на уровень Metadata, без тела запроса — не было бы видно, что выдан cluster-admin.
apiVersion: audit.k8s.io/v1
kind: Policy
rules:
  - level: RequestResponse
    verbs: ["create", "delete", "update", "patch", "get", "list"]
    resources:
      - group: ""
        resources: ["pods", "secrets", "configmaps", "serviceaccounts", "roles", "rolebindings"]
      - group: "rbac.authorization.k8s.io"
        resources: ["roles", "rolebindings"]
  - level: Metadata
    resources:
      - group: "*"
        resources: ["*"]
